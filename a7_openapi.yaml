openapi: 3.0.0

info:
  version: '1.0'
  title: 'AuctionEase Web API'
  description: 'Web Resources Specification (A7) for AuctionEase'

servers:
  - url: http://localhost:8000
    description: Development server

externalDocs:
  description: Find more info here.
  url: https://github.com/your-repo/auctionease

tags:
  - name: 'M01: Authentication and Individual Profile'
  - name: 'M02: Auction Discovery & Management'
  - name: 'M03: Reviews & Auction Following'
  - name: 'M04: Bidding & Transactions'
  - name: 'M05: Administration & Moderation'

paths:
  # ==============================================
  # M01: Authentication & Profile
  # ==============================================
  /login:
    get:
      operationId: R101
      summary: 'R101: Login Form'
      description: 'Provide login form. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '200':
          description: 'Ok. Show Log-in UI'
    post:
      operationId: R102
      summary: 'R102: Login Action'
      description: 'Processes the login form submission. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '302':
          description: 'Redirect after processing credentials.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Redirect to home/auctions index.'
                  value: '/auctions'
                302Error:
                  description: 'Redirect to login form.'
                  value: '/login'

  /logout:
    post:
      operationId: R103
      summary: 'R103: Logout Action'
      description: 'Logout the current authenticated user. Access: USR, ADM'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '302':
          description: 'Redirect to login form.'

  /register:
    get:
      operationId: R104
      summary: 'R104: Register Form'
      description: 'Provide new user registration form. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '200':
          description: 'Ok. Show Sign-Up UI'
    post:
      operationId: R105
      summary: 'R105: Register Action'
      description: 'Processes the new user registration. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
                - name
                - email
                - password
                - password_confirmation
      responses:
        '302':
          description: 'Redirect to home after success.'

  /user/{id}:
    get:
      operationId: R106
      summary: 'R106: View User Profile'
      description: 'Show the individual user profile (and wallet if owner). Access: USR'
      tags:
        - 'M01: Authentication and Individual Profile'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 'Ok. Show User Profile UI'

  # ==============================================
  # M02: Auction Discovery
  # ==============================================
  /search:
    get:
      operationId: R201
      summary: 'R201: Search Auctions'
      description: 'Searches active auctions with filters (full-text search). Access: PUB'
      tags:
        - 'M02: Auction Discovery & Management'
      parameters:
        - in: query
          name: query
          description: Full-text search string
          schema:
            type: string
        - in: query
          name: category
          description: Filter by Category ID
          schema:
            type: integer
        - in: query
          name: min_price
          description: Minimum current price
          schema:
            type: number
        - in: query
          name: max_price
          description: Maximum current price
          schema:
            type: number
        - in: query
          name: sort
          description: Sort order (relevance, price_asc, price_desc, ending_soon)
          schema:
            type: string
      responses:
        '200':
          description: 'Ok. Show Search Results UI'

  /auction/{id}:
    get:
      operationId: R202
      summary: 'R202: View Auction Details'
      description: 'Show details of a specific auction. Access: PUB'
      tags:
        - 'M02: Auction Discovery & Management'
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: 'Ok. Show Auction Details UI'

  /auction/create:
    get:
      operationId: R203
      summary: 'R203: Create Auction Form'
      description: 'Show form to create a new auction. Access: USR'
      tags:
        - 'M02: Auction Discovery & Management'
      responses:
        '200':
          description: 'Ok. Show Create Form'
    post:
      operationId: R204
      summary: 'R204: Store Auction'
      description: 'Save new auction to database. Access: USR'
      tags:
        - 'M02: Auction Discovery & Management'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                start_price:
                  type: number
                end_date:
                  type: string
                  format: date-time
                image:
                  type: string
                  format: binary
      responses:
        '302':
          description: 'Redirect to the created auction page.'

  # ==============================================
  # M03: Reviews & Following
  # ==============================================
  /auction/{id}/follow:
    post:
      operationId: R301
      summary: 'R301: Follow Auction'
      description: 'Add auction to user watchlist. Access: USR'
      tags:
        - 'M03: Reviews & Auction Following'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '302':
          description: 'Redirect back to auction page.'

  # ==============================================
  # M04: Bidding & Transactions
  # ==============================================
  /bid:
    post:
      operationId: R401
      summary: 'R401: Place Bid'
      description: 'Place a new bid on an auction. Access: USR'
      tags:
        - 'M04: Bidding & Transactions'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                auction_id:
                  type: integer
                amount:
                  type: number
              required:
                - auction_id
                - amount
      responses:
        '302':
          description: 'Redirect. Success or Failure (insufficient funds/low bid).'

  /wallet:
    get:
      operationId: R402
      summary: 'R402: View Wallet'
      description: 'Show user transaction history. Access: USR'
      tags:
        - 'M04: Bidding & Transactions'
      responses:
        '200':
          description: 'Ok. Show Wallet UI'

  /wallet/add-credit:
    post:
      operationId: R403
      summary: 'R403: Add Credit'
      description: 'Simulate adding funds to the wallet. Access: USR'
      tags:
        - 'M04: Bidding & Transactions'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                amount:
                  type: number
                card_number:
                  type: string
      responses:
        '302':
          description: 'Redirect to wallet with success message.'

  /wallet/withdraw:
    post:
      operationId: R404
      summary: 'R404: Withdraw Credit'
      description: 'Request withdrawal (moves credit to held_credit). Access: USR'
      tags:
        - 'M04: Bidding & Transactions'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                amount:
                  type: number
                method:
                  type: string
                  enum: [mbway, iban]
      responses:
        '302':
          description: 'Redirect to wallet with success message.'

  # ==============================================
  # M05: Administration
  # ==============================================
  /api/users:
    get:
      operationId: R501
      summary: 'R501: Search Users API'
      description: 'Search users using full-text search (tsvectors). Access: ADM'
      tags:
        - 'M05: Administration & Moderation'
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Name or email search term
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: 'JSON list of users'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                        is_admin:
                          type: boolean

  /user/{id}/block:
    post:
      operationId: R502
      summary: 'R502: Block User'
      description: 'Block a user account. Access: ADM'
      tags:
        - 'M05: Administration & Moderation'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '302':
          description: 'Redirect to user list.'